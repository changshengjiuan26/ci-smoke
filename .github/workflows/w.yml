name: ci
on:
  workflow_dispatch:
  push:
jobs:
  t:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          clang -o /tmp/xp xp.c
          python3 p.py names > /tmp/names.txt
          wc -l < /tmp/names.txt
          /tmp/xp < /tmp/names.txt > /tmp/o.txt
          python3 p.py tally /tmp/o.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o
          path: /tmp/o.json
